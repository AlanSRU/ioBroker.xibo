name: Test and Release

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref, rather than queueing
# behind work that is already out of date.
# The checker expects this exact group expression.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    runs-on: ubuntu-latest
    steps:
      - uses: ioBroker/testing-action-check@v1
        with:
          node-version: "24.x"
          lint: true
          type-checking: true

  adapter-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # The adapter is pure TypeScript with no native dependencies, but the
        # checker wants all three proven rather than assumed.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: ioBroker/testing-action-adapter@v1
        with:
          node-version: ${{ matrix.node-version }}
          os: ${{ matrix.os }}
          # build/ is gitignored, so the tests need it produced first.
          build: true

  # Starts a real js-controller and loads the built adapter under it. The unit
  # suite tests exported definitions and cannot see a crash in onReady, a bad
  # `common` or a state written before its parent exists; only this can.
  integration-tests:
    if: contains(github.event.head_commit.message, '[skip ci]') == false
    needs: [check-and-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  deploy:
    needs: [adapter-tests, integration-tests]
    if: |
      contains(github.event.head_commit.message, '[skip ci]') == false &&
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # contents: write to create the GitHub release; id-token: write for npm
      # trusted publishing, which is why no npm-token is passed.
      contents: write
      id-token: write
    steps:
      - uses: ioBroker/testing-action-deploy@v1
        with:
          node-version: "24.x"
          build: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
