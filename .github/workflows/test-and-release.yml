name: Test and Release

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-**"
  pull_request:
    branches: [main]

# A new push supersedes an in-flight run for the same ref, rather than queueing
# behind work that is already out of date.
# The checker expects this exact group expression.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - uses: ioBroker/testing-action-check@v1
        with:
          node-version: ${{ matrix.node-version }}
          lint: true
      - run: npm run check
      - run: npm run build

  adapter-tests:
    needs: [check-and-lint]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22.x, 24.x]
        # The adapter is pure TypeScript with no native dependencies, but the
        # checker wants all three proven rather than assumed.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Starts a real js-controller and loads the built adapter under it. The unit
  # suite tests exported definitions and cannot see a crash in onReady, a bad
  # `common` or a state written before its parent exists; only this can.
  integration-tests:
    needs: [check-and-lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:integration

  deploy:
    needs: [adapter-tests, integration-tests]
    # Only a version tag publishes; ordinary pushes stop at the tests.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The default GITHUB_TOKEN is read-only here, so creating the release comes
    # back 403 "Resource not accessible by integration" - every check green and
    # no release produced. Proven on the sibling streamdeck adapter's v0.3.1.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
