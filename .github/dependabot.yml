# Dependabot configuration
# Cooldown delays updating normal npm dependencies by 7 days but allows security updates to be processed immediately.
# Note: Cooldown is not supported for the github-actions ecosystem.
# Reference: https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
version: !!int '2'
updates:

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '17 3 9 * *'
      timezone: 'Europe/London'
    open-pull-requests-limit: !!int '15'
    cooldown:
      default-days: !!int '7'
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@iobroker/eslint-config'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@iobroker/types'
        update-types:
          - 'version-update:semver-major'
      - dependency-name: '@iobroker/testing'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'cron'
      cronjob: '41 6 16 * *'
      timezone: 'Europe/London'
    open-pull-requests-limit: !!int '15'
    cooldown:
      default-days: !!int '7'
    ignore:
      - dependency-name: '*'
        update-types:
          - 'version-update:semver-major'
